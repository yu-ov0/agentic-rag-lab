[project]
name = "agentic-rag-lab"
version = "0.1.0"
description = "Agentic RAG: decompose multi-hop questions, retrieve per sub-question, judge sufficiency, rewrite or refuse"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "rank-bm25>=0.2.2",
  "jieba>=0.42.1",
  "numpy>=1.26",
  "fastembed>=0.4",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
